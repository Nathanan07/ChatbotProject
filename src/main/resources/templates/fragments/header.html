<div xmlns:th="http://www.thymeleaf.org">
    <header th:fragment="header(activePage)"
            class="bg-light border-bottom">

    </header>
</div>

<!-- Nouvelle conversation -->
<a th:href="@{/}" class="btn btn-outline-light w-100 mb-4">
    + Nouvelle conversation
</a>

<h6 class="text-secondary">Historique</h6>
<div class="list-group">
    <a th:each="c : ${conversations}"
       th:href="@{/conversations/{id}(id=${c.id})}"
       th:text="${c.titre}"
       class="list-group-item list-group-item-action"
       th:classappend="${conversation != null and conversation.id == c.id} ? 'active' : ''">
    </a>
</div>
<div class="" th:if="${utilisateur != null}">




<span th:text="${utilisateur != null
   ? utilisateur.prenom + ' ' + utilisateur.nom
   : 'Anonyme'}">
   Anonyme
</span>


    <br>


    <small th:text="${utilisateur != null
   ? utilisateur.role.nom
   : 'Visiteur'}">
        Visiteur
    </small>




</div>
