<div xmlns:th="http://www.thymeleaf.org">
    <aside th:fragment="navbar(activePage)" class="eve-sidebar">

        <a th:href="@{/}" class="eve-brand"><img th:src="@{/img/LogoEve.png}" alt="Eve"></a>

        <!-- Nouveau chat : renvoie vers l'accueil (aucune conversation sélectionnée) -->
        <a th:href="@{/}" class="eve-new-chat">
            <i class="ico ico-plus"></i> Nouveau chat
        </a>

        <ul class="eve-nav">
            <li>
                <a th:href="@{/}" th:classappend="${activePage == 'conversations'} ? 'active'">
                    <i class="ico ico-chat"></i> Conversations
                </a>
            </li>
            <li>
                <a th:href="@{/modeles}" th:classappend="${activePage == 'modeles'} ? 'active'">
                    <i class="ico ico-grid"></i> Modèles IA
                </a>
            </li>
            <li>
                <!-- Historique : déplie la liste des anciennes conversations -->
                <a href="#historiqueListe" class="eve-history-toggle"
                   data-bs-toggle="collapse" role="button"
                   th:attr="aria-expanded=${activePage == 'conversations'}">
                    <i class="ico ico-history"></i> Historique
                    <i class="ico ico-down chevron"></i>
                </a>

                <div id="historiqueListe" class="collapse eve-history"
                     th:classappend="${activePage == 'conversations'} ? 'show'">

                    <p class="eve-history-empty"
                       th:if="${conversations == null or #lists.isEmpty(conversations)}">
                        Aucune conversation pour le moment.
                    </p>

                    <a th:each="c : ${conversations}"
                       th:href="@{/conversations/{id}(id=${c.id})}"
                       th:title="${c.titre}"
                       class="eve-conv"
                       th:classappend="${conversation != null and conversation.id == c.id} ? 'active'">
                        <span class="eve-conv-title" th:text="${c.titre}">Titre</span>
                        <small class="eve-conv-model" th:text="${c.modeleIA.nom}">Modèle</small>
                    </a>
                </div>
            </li>
            <li>
                <a th:href="@{/login}" th:classappend="${activePage == 'login'} ? 'active'">
                    <i class="ico ico-login"></i> Deconnexion
                </a>
            </li>
        </ul>

        <p class="eve-tagline">Une IA<br>à vos côtés<br>tous les jours</p>
    </aside>
</div>
