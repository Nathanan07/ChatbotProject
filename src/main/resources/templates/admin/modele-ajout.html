<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: base(~{::content}, 'Eve - Ajouter un modèle', 'modeles')}">

<section th:fragment="content" class="eve-panel no-deco">

    <form th:action="@{/admin/modeles}" method="post" enctype="multipart/form-data" class="d-flex flex-column flex-grow-1">

        <div class="page-head">
            <div>
                <h1 class="page-title">Ajouter un modèle</h1>
                <p class="page-sub">Ajoutez un modèle d'IA depuis OpenRouter pour l'utiliser dans Eve.</p>
            </div>
        </div>

        <div class="page-body">
            <div class="form-grid">

                <!-- Colonne gauche : champs -->
                <div>
                    <div class="form-group">
                        <label class="eve-label" for="nom">Nom du modèle *</label>
                        <input class="eve-input" type="text" id="nom" name="nom" placeholder="Ex. Mon modèle" required>
                    </div>

                    <div class="form-group">
                        <label class="eve-label" for="identifiant">Identifiant OpenRouter*</label>
                        <input class="eve-input" type="text" id="identifiant" name="identifiantOpenRouter" placeholder="Ex. openai/gpt-4o" required>
                    </div>

                    <div class="form-group">
                        <label class="eve-label" for="fournisseur">Fournisseur *</label>
                        <select class="eve-select" id="fournisseur" name="fournisseur" required>
                            <option value="" selected disabled>Sélectionner un fournisseur</option>
                            <option>OpenAI</option>
                            <option>Anthropic</option>
                            <option>Google</option>
                            <option>Meta</option>
                            <option>Mistral</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="eve-label" for="urlLogo">URL du logo</label>
                        <input class="eve-input" type="url" id="urlLogo" name="urlLogo" placeholder="https://..">
                    </div>

                    <div class="form-group">
                        <label class="eve-label" for="description">Description</label>
                        <textarea class="eve-textarea" id="description" name="description" rows="4"
                                  placeholder="Décrivez brièvement les capacités de ce modèle…"></textarea>
                    </div>
                </div>

                <!-- Colonne droite : logo + statut -->
                <div>
                    <div class="side-card">
                        <h3>Importer un logo</h3>
                        <label class="dropzone" id="dropzone" for="logoFile">
                            <i class="ico ico-image"></i>
                            <strong>Importer un logo</strong>
                            <small>Glissez un fichier ici ou cliquez<br>pour parcourir</small>
                        </label>
                        <input type="file" id="logoFile" name="logo" accept=".png,.jpg,.jpeg,.svg" hidden>
                        <p class="hint-center">PNG, JPG ou SVG · 2 Mo max</p>
                    </div>

                    <div class="side-card">
                        <div class="switch-row">
                            <span class="lbl">Actif</span>
                            <label class="eve-switch">
                                <input type="checkbox" name="actif" checked>
                                <span class="slider"></span>
                            </label>
                        </div>
                        <p class="hint mt-3 mb-0">Le modèle sera disponible dans<br>Eve s'il est actif.</p>
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <a th:href="@{/admin/modeles}" class="btn-eve-dark">Annuler</a>
                <button type="submit" class="btn-eve">Créer le modèle</button>
            </div>
        </div>
    </form>
</section>
</html>
