<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: base('EveBot', ~{::content}, 'conversations')}">

<section th:fragment="content" class="eve-panel chat-page"
         th:classappend="${conversation != null} ? 'no-deco'">

    <!-- En-tête : visible uniquement dans une conversation -->
    <div class="chat-head" th:if="${conversation != null}">
        <span class="model-logo sm" th:classappend="${#strings.toLowerCase(conversation.modeleIA.fournisseur.nom)}"
              th:text="${#strings.substring(conversation.modeleIA.fournisseur.nom, 0, 1)}">M</span>
        <div>
            <h2 th:text="${conversation.titre}">Titre</h2>
            <small th:text="${conversation.modeleIA.nom}">Modèle</small>
        </div>
    </div>

    <!-- Zone des messages -->
    <div class="chat-messages" id="chatMessages">

        <!-- Aucune conversation sélectionnée -->
        <div class="chat-welcome" th:if="${conversation == null}">
            <h2>Comment puis-je vous <span class="grad-text">aider</span> ?</h2>
            <p>Choisissez un modèle IA et posez votre question.</p>
        </div>

        <!-- Messages de la conversation -->
        <div th:each="message : ${messages}"
             class="msg"
             th:classappend="${message.type.name() == 'UTILISATEUR'} ? 'user' : 'bot'">
            <div class="bubble" th:text="${message.contenu}"></div>
        </div>
    </div>

    <!-- Zone de saisie (même formulaire pour une nouvelle conversation ou une conversation existante) -->
    <form id="formChat" class="composer" method="post"
          th:action="${conversation == null} ? @{/conversations} : @{/conversations/{id}/messages(id=${conversation.id})}">

        <textarea name="prompt" id="chatPrompt" class="composer-input" rows="1"
                  required autofocus
                  th:placeholder="${conversation == null} ? 'Posez votre question...' : 'Écrivez votre message...'"></textarea>

        <div class="composer-bar">

            <!-- Nouvelle conversation : choix du modèle -->
            <label class="model-select-wrap" th:if="${conversation == null}">
                <i class="ico ico-box"></i>
                <select name="idModele" class="model-select" aria-label="Modèle IA" required>
                    <option value="" disabled th:selected="${modeleSelectionne == null}">Choisir un modèle IA</option>
                    <option th:each="m : ${modeles}"
                            th:value="${m.id}"
                            th:text="${m.nom}"
                            th:selected="${modeleSelectionne != null and modeleSelectionne == m.id}">
                    </option>
                </select>
                <i class="ico ico-down"></i>
            </label>

            <!-- Conversation existante : modèle imposé -->
            <span class="model-pill" th:if="${conversation != null}">
                <i class="ico ico-box"></i>
                <span th:text="${conversation.modeleIA.nom}">Modèle</span>
            </span>

            <span class="composer-hint">Entrée pour envoyer · Maj+Entrée pour un retour à la ligne</span>

            <button class="btn-send" id="btnSend" type="submit" aria-label="Envoyer">
                <i class="ico ico-send"></i>
            </button>
        </div>
    </form>
</section>
</html>
